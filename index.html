}

}

select:focus {

button {

.sensi-grid {

/* =====================================================
   FUNCIONES
===================================================== */

function limitar(numero) {
  return Math.max(1, Math.min(200, Math.round(numero)));
}


/* Número aleatorio entre mínimo y máximo */

function aleatorio(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}


/* Cambiar entre celular y PC */

function cambiarTipo() {

  const tipo = document.getElementById("tipo").value;

  const celularOpciones = document.getElementById("celularOpciones");
  const pcOpciones = document.getElementById("pcOpciones");

  if (tipo === "celular") {

    celularOpciones.style.display = "block";
    pcOpciones.style.display = "none";

  } else if (tipo === "pc") {

    celularOpciones.style.display = "none";
    pcOpciones.style.display = "block";

  } else {

    celularOpciones.style.display = "block";
    pcOpciones.style.display = "none";
  }
}


/* Cargar modelos de celular */

function cargarModelos() {

  const marca = document.getElementById("marca").value;
  const modelo = document.getElementById("modelo");

  modelo.innerHTML = "";

  if (!marca || !celulares[marca]) {

    const opcion = document.createElement("option");
    opcion.textContent = "Primero seleccioná una marca";
    opcion.value = "";

    modelo.appendChild(opcion);
    return;
  }

  const modelos = Object.keys(celulares[marca]);

  const primero = document.createElement("option");
  primero.value = "";
  primero.textContent = "Seleccionar modelo";
  modelo.appendChild(primero);

  modelos.forEach(function(nombre) {

    const opcion = document.createElement("option");

    opcion.value = nombre;
    opcion.textContent = nombre;

    modelo.appendChild(opcion);
  });
}

/* =====================================================
   GENERAR SENSIBILIDAD
===================================================== */

function generarSensi() {

  const tipo = document.getElementById("tipo").value;
  const estilo = document.getElementById("estilo").value;

  if (!tipo) {

    alert("Seleccioná si jugás en celular o PC.");
    return;
  }


  let base = 0;
  let nombreDispositivo = "";
  let configuracion = "";


  /* =========================
     CELULAR
  ========================= */

  if (tipo === "celular") {

    const marca = document.getElementById("marca").value;
    const modelo = document.getElementById("modelo").value;
    const dedos = Number(document.getElementById("dedos").value);

    if (!marca || !modelo) {

      alert("Seleccioná la marca y el modelo de tu celular.");
      return;
    }

    base = celulares[marca][modelo];

    nombreDispositivo = modelo;

    configuracion = "📱 " + modelo;


    /* Ajuste por dedos */

    if (dedos === 2) {
      base -= 5;
    }

    if (dedos === 3) {
      base += 2;
    }

    if (dedos === 4) {
      base += 5;
    }


    /* Ajuste por estilo */

    if (estilo === "headshot") {
      base += 8;
    }

    if (estilo === "rush") {
      base += 12;
    }

    if (estilo === "sniper") {
